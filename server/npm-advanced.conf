# Required, not optional, for any instance reachable from an address you do not
# control. See the checklist at the top of server/README.md.
#
# Paste this into Nginx Proxy Manager, in the proxy host for your domain, under
# Advanced > Custom Nginx Configuration.
#
# What it does: nothing is served until the sync server says the visitor has a
# valid session. The check happens in the proxy, before any of the app reaches
# the browser, which is the difference between a lock and a curtain. A login
# drawn by the app itself runs in the visitor's browser and can be walked past;
# this cannot, because the files never arrive.
#
# Without it the app is served to whoever types the address. Their data would be
# theirs and yours would still be encrypted, so it is not a data leak, but it is
# an open dosing tool on your domain and a login prompt for strangers to guess
# at.
#
# Verify it rather than trusting it. From a machine with no session, both of
# these must answer 302 to /login:
#
#     curl -sI https://your.domain/ | head -1
#     curl -sI https://your.domain/plan | head -1
#
# One account, one password. The same pair that signs in to sync, because the
# thing being asked is the same server's /api/login.
#
# Replace bench-sync:8787 if the proxy reaches the sync server by another
# address. Use whatever hostname already works in the Forward Hostname field.
# On the machine this was first run on that meant the host's LAN address,
# 192.168.1.44, because NPM and the app are not in the same Docker network.
#
# Declaring `location /` here is correct and not a conflict: NPM omits its own
# default location when the advanced block already contains one. An earlier
# version of this file avoided it out of caution and was the wrong shape. This
# is the version confirmed working in front of a live site.

# The check itself. internal means a browser cannot call this path directly.
location = /_auth {
    internal;
    proxy_pass              http://bench-sync:8787/api/session;

    # No body and no length: this asks a question, it does not send anything.
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";

    # The cookie is the whole point of the request, so it has to be forwarded.
    proxy_set_header        Cookie $http_cookie;
    proxy_set_header        X-Original-URI $request_uri;
}

# The login page and the endpoints it needs, before the guard applies to
# everything else. Guarding these would mean being turned away from the page
# that exists to let you in.
location /login {
    proxy_pass http://bench-sync:8787/login;
}

location /api/ {
    proxy_pass http://bench-sync:8787/api/;
}

# Everything else: the app itself.
location / {
    auth_request /_auth;

    # Where an unauthenticated visitor lands. `next` brings them back to the
    # page they asked for once they are in.
    error_page 401 = @signin;

    proxy_pass          http://bench-web:3210;
    proxy_set_header    Host $host;
    proxy_set_header    X-Real-IP $remote_addr;
    proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;

    # The app is a PWA and upgrades nothing, but Next dev and the update check
    # both use these, and leaving them out breaks reloads in odd ways.
    proxy_http_version  1.1;
    proxy_set_header    Upgrade $http_upgrade;
    proxy_set_header    Connection "upgrade";
}

location @signin {
    return 302 /login?next=$request_uri;
}
